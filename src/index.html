<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volume</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="container">
      <div id="volumeRow">
        <p id="text">Volume: 100%</p>
        <button
          id="resetButton"
          title="Reset to 100%"
          aria-label="Reset to 100%"
          hidden
          disabled
        >
          <span id="resetIcon"></span>
        </button>
      </div>
      <input
        id="slider"
        type="range"
        min="0"
        max="5"
        value="1"
        step="0.1"
        disabled
      />
      <div id="settingsContainer">
        <div class="settingsSection">
          <label class="settingsLabel" for="rememberVolumeCheckbox">
            Remember volume for this website
          </label>
          <input id="rememberVolumeCheckbox" type="checkbox" disabled />
        </div>
      </div>
    </div>
  </body>
  <script src="index.js"></script>
</html>
